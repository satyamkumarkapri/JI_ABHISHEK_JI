<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <radialGradient id="studioGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2D281E" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#151419" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A6F1D"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#studioGlow)"/>
  <rect x="20" y="20" width="760" height="960" rx="16" stroke="url(#goldAccent)" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Subtle Atmospheric Lighting Shapes -->
  <circle cx="400" cy="380" r="280" fill="#D4AF37" fill-opacity="0.05" filter="blur(60px)"/>

  <!-- Artistic Stylized Creator Silhouette / Studio Framing -->
  <g transform="translate(0, 40)">
    <!-- Backlight aura -->
    <path d="M400 180 C310 180 250 240 250 350 C250 450 310 520 400 520 C490 520 550 450 550 350 C550 240 490 180 400 180 Z" fill="#1C1B24" stroke="url(#goldAccent)" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Shoulders & Coat Line -->
    <path d="M210 650 C210 540 280 500 400 500 C520 500 590 540 590 650 L640 850 H160 L210 650 Z" fill="#14131A" stroke="url(#rimLight)" stroke-width="2"/>
    
    <!-- Monogram Emblem at Center -->
    <circle cx="400" cy="350" r="75" fill="#0E0D12" stroke="url(#goldAccent)" stroke-width="2"/>
    <text x="400" y="362" text-anchor="middle" font-family="'Cinzel', serif" font-size="44" font-weight="700" fill="url(#goldAccent)" letter-spacing="4">JA</text>
  </g>

  <!-- Bottom Editorial Typography Overlay -->
  <rect x="60" y="760" width="680" height="160" rx="12" fill="#09090B" fill-opacity="0.85" stroke="#262633" stroke-width="1"/>
  
  <text x="400" y="815" text-anchor="middle" font-family="'Cinzel', serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="3">
    JI ABHISHEK JI
  </text>
  <text x="400" y="850" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#D4AF37" letter-spacing="5">
    ABHISHEK SINGH • OFFICIAL PORTRAIT
  </text>
  <text x="400" y="885" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8E8EA0" letter-spacing="1">
    Replaceable with verified photograph in src/config/site.ts
  </text>
</svg>
